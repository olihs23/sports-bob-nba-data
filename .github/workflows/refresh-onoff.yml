name: Refresh licensed NBA player net ratings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect_onoff_ratings.py"
      - ".github/workflows/refresh-onoff.yml"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve attributed licensed NBA on-off net ratings
        run: python3 scripts/collect_onoff_ratings.py
      - name: Commit verified source records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league/onoff_ratings.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh licensed on-court net rating dataset [skip ci]"
            git pull --rebase origin main
            git push
          fi
