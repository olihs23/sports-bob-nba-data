name: Collect official NBA season boxscores

on:
  push:
    branches: [main]
    paths:
      - "scripts/collect_season_boxscores.py"
      - ".github/workflows/collect-season.yml"
  workflow_dispatch:
    inputs:
      start:
        description: "First Eastern calendar date to collect"
        required: true
        default: "2026-10-20"
      end:
        description: "Last Eastern date (cannot be future)"
        required: true
        default: "2026-11-19"

permissions:
  contents: write

concurrency:
  group: sports-bob-season-boxscore-writes
  cancel-in-progress: false

jobs:
  collect-official-boxscores:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Collect first-party NBA day pages and completed game boxscores
        env:
          START: ${{ github.event.inputs.start || '2026-10-20' }}
          END: ${{ github.event.inputs.end || '2026-11-19' }}
        run: python3 scripts/collect_season_boxscores.py --start "$START" --end "$END" --workers 4 --max-new 350
      - name: Commit verified history, without overwriting source failures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/season/
          if ! git diff --cached --quiet; then
            git commit -m "Publish sourced NBA completed-game and player histories [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No new verified season data."
          fi
