name: Probe free on-court rating tables
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_oncourt_ratings.py"
      - ".github/workflows/probe-oncourt.yml"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check all-player on-court ratings and definitions
        run: python3 scripts/probe_oncourt_ratings.py
      - name: Save coverage evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league/oncourt_ratings_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Assess free on-court ratings coverage [skip ci]"
            git pull --rebase origin main
            git push
          fi
