name: Verify complete NBA advanced ratings sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_ratings_sources.py"
      - ".github/workflows/probe-ratings.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check NBA official APIs, alternate NBA domains and free advanced tables
        run: python3 scripts/probe_ratings_sources.py
      - name: Save source suitability evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league/ratings_source_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit complete advanced ratings feeds [skip ci]"
            git pull --rebase origin main
            git push
          fi
