name: Refresh licensed team advanced ratings (30 teams)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect_team_ratings_csv.py"
      - ".github/workflows/refresh-team-ratings.yml"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate published CC BY 4.0 30-team rating CSV
        run: python3 scripts/collect_team_ratings_csv.py
      - name: Preserve verified 30-team source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league/team_advanced_estimates.json
          if ! git diff --cached --quiet; then
            git commit -m "Save licensed 30-team estimated advanced ratings [skip ci]"
            git pull --rebase origin main
            git push
          fi
