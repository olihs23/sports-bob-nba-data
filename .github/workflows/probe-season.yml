name: Probe official full-season NBA feeds
on:
  push:
    paths:
      - "scripts/probe_fullseason_official.py"
      - ".github/workflows/probe-season.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Test NBA.com schedule and game boxscore sources
        run: python3 scripts/probe_fullseason_official.py
      - name: Save reachability and structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league/fullseason_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record official NBA season feed probe [skip ci]"
            git pull --rebase origin main
            git push
          fi
