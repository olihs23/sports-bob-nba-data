name: Verify free advanced ratings JSON APIs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_ratings_apis.py"
      - ".github/workflows/probe-ratings-apis.yml"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check documented API endpoints with no secrets or guessed stats
        run: python3 scripts/probe_ratings_apis.py
      - name: Commit API coverage evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league/ratings_api_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Check free ratings API availability [skip ci]"
            git pull --rebase origin main
            git push
          fi
