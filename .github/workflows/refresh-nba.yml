name: Refresh official NBA source pilot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/refresh_official_nba.py"
      - "scripts/check_official_hosts.py"
      - ".github/workflows/refresh-nba.yml"

permissions:
  contents: write

concurrency:
  group: sports-bob-nba-refresh
  cancel-in-progress: false

jobs:
  check-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check NBA.com and validate published fields
        run: python3 scripts/refresh_official_nba.py
      - name: Check alternate first-party NBA hosts
        run: python3 scripts/check_official_hosts.py
      - name: Save data and per-source status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/host_checks.json data/status.json
          if [ -f data/latest.json ]; then git add data/latest.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update verified NBA source data and freshness status [skip ci]"
            git push
          else
            echo "No data changes to commit."
          fi
