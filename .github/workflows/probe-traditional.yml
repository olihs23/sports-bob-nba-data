name: Audit official NBA traditional boxscore fields
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_traditional_fields.py"
      - ".github/workflows/probe-traditional.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read verified NBA player's entire official statistics row
        run: python3 scripts/probe_traditional_fields.py
      - name: Save field audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league/official_player_field_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record official traditional NBA player field names [skip ci]"
            git pull --rebase origin main
            git push
          fi
