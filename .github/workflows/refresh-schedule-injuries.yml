name: Refresh NBA schedule and ESPN injury backup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect_espn_schedule_injuries.py"
      - ".github/workflows/refresh-schedule-injuries.yml"
  schedule:
    - cron: "23 */2 * * *"

permissions:
  contents: write

concurrency:
  group: sports-bob-nba-live-schedule-injuries
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch public ESPN NBA schedule and injury listings
        run: python3 scripts/collect_espn_schedule_injuries.py
      - name: Commit validated refreshes only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh ESPN NBA schedule and injury listings [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No new verified ESPN data."
          fi
