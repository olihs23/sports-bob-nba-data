name: One-off NBA official 5-man lineup cloud-browser test
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-official-lineup-bot.yml"
permissions:
  contents: write
jobs:
  test-one-knicks-lineup:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Run preinstalled Chrome and test NBA official lineup source
        run: |
          mkdir -p data/diagnostics
          python3 <<'PY'
          import json, subprocess, shutil, re, datetime, pathlib, html
          from html.parser import HTMLParser
          output = pathlib.Path("data/diagnostics/official_fiveman_brunson_bot_test.json")
          url = ("https://www.nba.com/stats/lineups/advanced?"
                 "Season=2026-27&SeasonType=Regular%20Season&TeamID=1610612752")
          report = {
            "checkedAtUtc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "scope": "ONE official NBA five-man lineup including Jalen Brunson, 2026-27 regular season",
            "officialSource": url, "bot": "GitHub Actions preinstalled Chrome headless",
            "result": "not_verified", "sourceHost": "nba.com", "season": "2026-27",
            "playerId": 1628973, "teamId": 1610612752,
            "attempts": [], "lineup": None
          }
          chrome = next((shutil.which(n) for n in ("google-chrome", "google-chrome-stable", "chromium", "chromium-browser") if shutil.which(n)), None)
          report["chromeExecutable"] = chrome
          if chrome:
            try:
              version = subprocess.run([chrome, "--version"],capture_output=True,text=True,timeout=5)
              report["chromeVersion"] = version.stdout.strip()[:200]
              p = subprocess.run([
                chrome, "--headless=new", "--no-sandbox",
                "--disable-dev-shm-usage", "--disable-gpu",
                "--virtual-time-budget=16000", "--dump-dom", url
              ],capture_output=True,text=True,timeout=39)
              report["attempts"].append({
                "name": "official_nba_chrome_page",
                "status": "response_captured" if p.stdout.strip() else "empty_response",
                "exitCode": p.returncode,
                "htmlBytes": len(p.stdout),
                "stderrTail": p.stderr[-1100:],
              })
              dom = p.stdout
              class TableRows(HTMLParser):
                def __init__(self):
                  super().__init__()
                  self.inside_row=False
                  self.inside_cell=False
                  self.cellbuf=[]
                  self.cells=[]
                  self.rows=[]
                def handle_starttag(self, tag, attrs):
                  if tag=="tr":
                    self.inside_row=True;self.cells=[]
                  if tag in ("td","th") and self.inside_row:
                    self.inside_cell=True;self.cellbuf=[]
                def handle_data(self,d):
                  if self.inside_cell:self.cellbuf.append(d)
                def handle_endtag(self,tag):
                  if tag in ("td","th") and self.inside_cell:
                    self.cells.append(" ".join("".join(self.cellbuf).split()))
                    self.inside_cell=False
                  if tag=="tr" and self.inside_row:
                    self.rows.append(self.cells)
                    self.inside_row=False
              parser=TableRows()
              parser.feed(dom)
              header_row=next((row for row in parser.rows if any("OffRtg" in x for x in row) and any("DefRtg" in x for x in row)),None)
              report["attempts"].append({"name":"nba_html_table_parse","status":"parsed",
                                        "tableRows":len(parser.rows),"hasAdvancedHeaders":bool(header_row)})
              if header_row:
                for row in parser.rows:
                  joined=" ".join(row)
                  if "Brunson" not in joined or "NYK" not in row:continue
                  wanted=("Towns","Anunoby","Hart","Bridges","Brunson")
                  if not all(name in joined for name in wanted):continue
                  try:
                    # Table positions follow NBA.com's labeled header row.
                    pairs={header.strip():val.strip() for header,val in zip(header_row,row)}
                    k=lambda x:next((float(v) for a,v in pairs.items() if a.lower()==x.lower()),None)
                    off,defr,net=k("OffRtg"),k("DefRtg"),k("NetRtg")
                    minutes=k("MIN")
                    if None in (off,defr,net,minutes) or abs(off-defr-net)>.12:continue
                    report["lineup"]={
                      "names":list(wanted),"team":"NYK","minutesTogether":minutes,
                      "offRating":off,"defRating":defr,"netRating":net,
                      "source":"NBA.com original lineups Advanced table",
                    }
                    report["result"]="verified_official_lineup"
                    break
                  except (ValueError,TypeError):pass
              if report["result"]!="verified_official_lineup":
                report["reason"]="No verified 2026-27 lineup with official ratings found in Chrome-rendered table"
            except Exception as e:
              report["attempts"].append({"name":"chrome_execution","status":"failed","error":str(e)[:400]})
              report["reason"]="Chrome execution or connection failure"
          else:
            report["reason"]="Chrome is not preinstalled on this GitHub runner"
          output.write_text(json.dumps(report,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({k:report[k] for k in ("result","reason","chromeExecutable","attempts") if k in report},indent=2))
          PY
      - name: Save read-only test result in diagnostics
        if: always()
        run: |
          if test -f data/diagnostics/official_fiveman_brunson_bot_test.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/diagnostics/official_fiveman_brunson_bot_test.json
            if ! git diff --cached --quiet; then
              git commit -m "Record official NBA one-lineup cloud bot diagnostic [skip ci]"
              git pull --rebase origin main
              git push
            fi
          fi
      - name: Attach diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-lineup-official-nba
          path: data/diagnostics/official_fiveman_brunson_bot_test.json
          if-no-files-found: warn
          retention-days: 7
