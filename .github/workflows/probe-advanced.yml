name: Probe NBA official advanced stats pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_advanced_sources.py"
      - ".github/workflows/probe-advanced.yml"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Test NBA advanced official sources and schemas
        run: python3 scripts/probe_advanced_sources.py
      - name: Save source check only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league/advanced_source_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit NBA official advanced pages [skip ci]"
            git pull --rebase origin main
            git push
          fi
